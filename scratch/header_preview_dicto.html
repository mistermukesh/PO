<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      background: #e0e0e0;
      padding: 40px;
      font-family: Arial, sans-serif;
    }
    .paper {
      background: #ffffff;
      width: 750px;
      padding: 0px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="paper">
    
    <!-- Top Header Banner matching user reference image 100% EXACTLY -->
    <div style="width: 100%; margin-bottom: 0px;">
      <svg width="100%" height="52" viewBox="0 0 700 52" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <!-- Full-width Bottom Accent Line -->
        <rect x="0" y="48" width="700" height="4" fill="#313131" />

        <!-- Dark Left Container for Logo -->
        <polygon points="0,0 225,0 170,42 0,42" fill="#313131" />

        <!-- Deep Maroon Horizontal Bar -->
        <polygon points="240,9 700,9 700,37 195,37" fill="#662B42" />

        <!-- Purchase Order Text -->
        <text x="685" y="27" fill="#FFFFFF" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="bold" letter-spacing="2" text-anchor="end">PURCHASE ORDER</text>
      </svg>
    </div>

  </div>
</body>
</html>
