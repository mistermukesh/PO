<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Purchase Order Management System</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="shortcut icon" href="https://i.imgur.com/gK9RzUp.png" type="image/x-icon">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="logo-header">
        <svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom: 10px;">
          <circle cx="20" cy="20" r="10" fill="#E91E63" />
          <circle cx="50" cy="20" r="10" fill="#E91E63" />
          <circle cx="80" cy="20" r="10" fill="#E91E63" />
          <circle cx="20" cy="50" r="10" fill="#E91E63" />
          <circle cx="50" cy="50" r="10" fill="#D81B60" />
          <circle cx="80" cy="50" r="10" fill="#AD1457" />
          <circle cx="20" cy="80" r="10" fill="#880E4F" />
          <circle cx="50" cy="80" r="10" fill="#880E4F" />
          <circle cx="80" cy="80" r="10" fill="#880E4F" />
        </svg>
        <div class="logo-title">KAN UNIVERSAL</div>
        <div class="logo-subtitle">Purchase Order Portal</div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="api-url">Apps Script Web App API URL</label>
          <input type="url" id="api-url" class="form-control" placeholder="https://script.google.com/macros/s/.../exec" required>
        </div>
        <div class="form-group">
          <label for="passcode">Security Passcode</label>
          <input type="password" id="passcode" class="form-control" placeholder="Enter Access Passcode" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">
          🔒 Authenticate Portal
        </button>
      </form>
      
      <div style="margin-top: 20px; font-size: 11px; color: var(--text-muted);">
        Secured connection directly to Google Spreadsheet & Drive.
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const apiUrl = document.getElementById('api-url').value.trim();
      const passcode = document.getElementById('passcode').value.trim();
      const loginBtn = document.getElementById('login-btn');

      window.UI.showLoader(loginBtn, 'Connecting...');

      try {
        await window.AUTH.login(apiUrl, passcode);
        window.UI.showToast('Login successful! Loading dashboard...', 'success');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1200);
      } catch (err) {
        window.UI.showToast(err.message || 'Login failed. Please check credentials.', 'error');
        window.UI.hideLoader(loginBtn, '🔒 Authenticate Portal');
      }
    });

    // Populate fields if they exist in localStorage
    document.addEventListener('DOMContentLoaded', () => {
      if (window.CONFIG.API_URL) {
        document.getElementById('api-url').value = window.CONFIG.API_URL;
      }
      if (window.CONFIG.PASSCODE) {
        document.getElementById('passcode').value = window.CONFIG.PASSCODE;
      }
    });
  </script>
</body>
</html>
